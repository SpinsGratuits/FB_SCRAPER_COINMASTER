name: Coin Master Links Scraper

on:
  schedule:
    # S'exécute automatiquement toutes les heures (ajustable)
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de lancer le scraper manuellement depuis l'onglet Actions

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium

    - name: Lancer le scraper
      run: python scraper.py

    - name: Sauvegarder les modifications dans le dépôt
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add scrapcoinmaster.json
        # Ne push que s'il y a des changements (nouveaux liens détectés)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des liens Coin Master" && git push)

